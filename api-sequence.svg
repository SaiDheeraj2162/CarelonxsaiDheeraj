<svg width="860" height="390" viewBox="0 0 860 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
 <title id="title">Hospital API integration sequence</title><desc id="desc">Provider electronic health record submits an authorization request, receives acknowledgement and status, with portal fallback after connection failure.</desc>
 <rect width="860" height="390" rx="26" fill="#F8FBFC"/><g font-family="Arial" font-size="12" font-weight="700"><text x="61" y="52" fill="#5009B5">Provider EHR</text><text x="238" y="52" fill="#5009B5">API gateway</text><text x="429" y="52" fill="#5009B5">Complete-First</text><text x="663" y="52" fill="#5009B5">Provider portal</text></g><g stroke="#C2D5D9" stroke-dasharray="5 7"><path d="M96 72v263M281 72v263M485 72v263M711 72v263"/></g>
 <path d="M101 110h172m0 0-10-7m10 7-10 7M290 142h187m0 0-10-7m10 7-10 7M477 179H290m0 0 10-7m-10 7 10 7M491 225h211m0 0-10-7m10 7-10 7M704 286H495m0 0 10-7m-10 7 10 7M286 318h414m0 0-10-7m10 7-10 7" stroke="#44B8F3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 <g font-family="Arial" font-size="11"><rect x="135" y="92" width="118" height="30" rx="8" fill="#EAF8FF"/><text x="151" y="111" fill="#146A93">Submit request</text><rect x="318" y="125" width="133" height="30" rx="8" fill="#F1ECFF"/><text x="334" y="144" fill="#5009B5">Check & route</text><rect x="325" y="162" width="121" height="30" rx="8" fill="#E2F9F7"/><text x="340" y="181" fill="#155D60">202 + request ID</text><rect x="529" y="208" width="141" height="30" rx="8" fill="#EAF8FF"/><text x="544" y="227" fill="#146A93">Status query / response</text><rect x="535" y="270" width="132" height="30" rx="8" fill="#FFF0F2"/><text x="553" y="289" fill="#B9384B">Failure: 503 response</text><rect x="392" y="301" width="177" height="30" rx="8" fill="#FFF6E7"/><text x="409" y="320" fill="#8A4A09">Portal fallback continues</text></g>
 <text x="48" y="366" fill="#60727B" font-family="Arial" font-size="11">Mock contract only: acceptance, status, meaningful rejection, duplicate/document check and fallback are simulated locally.</text>
