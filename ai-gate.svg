<svg width="860" height="390" viewBox="0 0 860 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
 <title id="title">AI governance safety gate</title><desc id="desc">Model remediation, shadow mode, validation, fairness, fail-safe and conditional G4 gate leading either to approved automation or manual nurse review.</desc>
 <defs><linearGradient id="g" x1="72" y1="0" x2="789" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#5009B5"/><stop offset="1" stop-color="#00BBBA"/></linearGradient></defs><rect width="860" height="390" rx="26" fill="#F9FCFC"/><path d="M119 168h93m75 0h92m77 0h91m79 0h93" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
 <g font-family="Arial" font-size="11" font-weight="700"><rect x="42" y="122" width="85" height="91" rx="15" fill="#F1ECFF"/><text x="57" y="160" fill="#5009B5">Remediate</text><text x="59" y="178" fill="#7955B1" font-size="9">ZIP removed</text><rect x="211" y="122" width="85" height="91" rx="15" fill="#EAF8FF"/><text x="229" y="160" fill="#146A93">Shadow</text><text x="225" y="178" fill="#3882A8" font-size="9">No workflow change</text><rect x="380" y="122" width="85" height="91" rx="15" fill="#E2F9F7"/><text x="393" y="160" fill="#155D60">Validate</text><text x="393" y="178" fill="#36777A" font-size="9">Blinded review</text><rect x="548" y="122" width="85" height="91" rx="15" fill="#FFF6E7"/><text x="565" y="160" fill="#8A4A09">Fairness</text><text x="560" y="178" fill="#A56A24" font-size="9">Parity checks</text><rect x="712" y="105" width="104" height="126" rx="17" fill="#5009B5"/><text x="741" y="153" fill="white">G4 gate</text><text x="729" y="173" fill="#DDD2F3" font-size="9">All evidence passes</text><text x="737" y="191" fill="#00BBBA" font-size="9">or fail safe</text></g>
 <path d="M764 237v57H599" stroke="#B9384B" stroke-width="3" stroke-linecap="round"/><path d="m599 294 10-7m-10 7 10 7" stroke="#B9384B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="416" y="270" width="188" height="52" rx="12" fill="#FFF0F2"/><text x="437" y="293" fill="#B9384B" font-family="Arial" font-size="11" font-weight="700">Gate fails or evidence missing</text><text x="448" y="310" fill="#B9384B" font-family="Arial" font-size="10">All traffic routes to nurses</text>
 <path d="M764 237v57H793" stroke="#00BBBA" stroke-width="3" stroke-linecap="round"/><rect x="653" y="270" width="162" height="52" rx="12" fill="#E2F9F7"/><text x="673" y="293" fill="#155D60" font-family="Arial" font-size="11" font-weight="700">Conditional activation</text><text x="682" y="310" fill="#36777A" font-family="Arial" font-size="10">Approvals only; audits run</text>
 <text x="42" y="55" fill="#5009B5" font-family="Arial" font-size="14" font-weight="700">AI can assist safely only after evidence, fairness and fail-safe conditions are met.</text><text x="42" y="78" fill="#60727B" font-family="Arial" font-size="11">It never denies or recommends denial. This prototype keeps auto-approval blocked.</text>
</svg>
